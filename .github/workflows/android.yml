name: Android preview
on:
  push:
    branches: [android-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read Android version
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open('config/android-release.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"ANDROID_VERSION={config['versionName']}\nANDROID_CODE={config['versionCode']}\n")
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: mobile/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare native dependencies
        run: |
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
          python3 scripts/prepare-android.py
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          gomobile init
      - name: Test shared backend
        run: go test ./...
      - name: Build embedded Xray
        working-directory: mobile
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        run: |
          go get golang.org/x/mobile@v0.0.0-20261011034528-197770444867
          go test -ldflags=-checklinkname=0 ./...
          mkdir -p ../flutter_client/android/app/libs
          gomobile bind -target=android/arm64,android/amd64 -androidapi 26 -trimpath -ldflags='-checklinkname=0 -s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../flutter_client/android/app/libs/svoi-mobile.aar .
      - name: Check Flutter and build update fixtures
        working-directory: flutter_client
        run: |
          export SVOI_ANDROID_TEST_KEYSTORE="$RUNNER_TEMP/svoi-test-debug.p12"
          echo "SVOI_ANDROID_TEST_KEYSTORE=$SVOI_ANDROID_TEST_KEYSTORE" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$SVOI_ANDROID_TEST_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname 'CN=SVOI Test' -keyalg RSA -validity 2
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build apk --debug --target-platform android-x64 --build-name "$ANDROID_VERSION-test" --build-number "$((ANDROID_CODE + 1))"
          mkdir -p android/app/src/androidTest/assets ../.tools
          cp build/app/outputs/flutter-apk/app-debug.apk android/app/src/androidTest/assets/update.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/test-key.p12" -storepass android -keypass android -alias test -dname 'CN=Update Test' -keyalg RSA -validity 2
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/test-key.p12" --ks-pass pass:android --out android/app/src/androidTest/assets/wrong-key.apk android/app/src/androidTest/assets/update.apk
          flutter build apk --debug --target-platform android-x64 --build-name "$ANDROID_VERSION" --build-number "$ANDROID_CODE"
          cp build/app/outputs/flutter-apk/app-debug.apk ../.tools/android-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/src/androidTest/assets/update.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs ../.tools/android-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start isolated VPN fixture
        run: |
          nohup .tools/android-core/xray run -config mobile/test-server.json > /tmp/svoi-xray-test.log 2>&1 &
          nohup python3 scripts/android-test-server.py > /tmp/svoi-http-test.log 2>&1 &
      - name: Verify Android tunnel and reconnects
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 scripts/android-emulator-check.py
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SVOI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'svoi-android-release.p12'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'SVOI_ANDROID_KEYSTORE={path}\n')
          PY
      - name: Build signed release APKs
        working-directory: flutter_client
        env:
          SVOI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SVOI_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --build-name "$ANDROID_VERSION" --build-number "$ANDROID_CODE"
          python3 ../scripts/android-release.py prepare
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/svoi-android-release.p12" "$RUNNER_TEMP/test-key.p12" "$RUNNER_TEMP/svoi-test-debug.p12"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            flutter_client/build/app/reports/androidTests/
            flutter_client/build/app/outputs/androidTest-results/
            /tmp/svoi-xray-test.log
            /tmp/svoi-http-test.log
            /tmp/svoi-android-resources.log
      - uses: actions/upload-artifact@v4
        with:
          name: SVOI-Android-preview-release
          path: .tools/android-release/*
          include-hidden-files: true
          retention-days: 14
  publish:
    needs: android
    if: github.ref == 'refs/heads/android-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SVOI-Android-preview-release
          path: .tools/android-release
      - name: Publish Android release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/android-release.py publish
