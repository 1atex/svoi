name: Android preview
on:
  push:
    branches: [android-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: mobile/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare native dependencies
        run: |
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
          python3 scripts/prepare-android.py
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          gomobile init
      - name: Test shared backend
        run: go test ./...
      - name: Build embedded Xray
        working-directory: mobile
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        run: |
          go get golang.org/x/mobile@v0.0.0-20261011034528-197770444867
          go test ./...
          mkdir -p ../flutter_client/android/app/libs
          gomobile bind -target=android/arm64,android/amd64 -androidapi 26 -trimpath -ldflags='-s -w' -o ../flutter_client/android/app/libs/svoi-mobile.aar .
      - name: Check Flutter and build preview APK
        working-directory: flutter_client
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build apk --debug --target-platform android-arm64,android-x64 --build-name 0.1.0-preview.1 --build-number 1
          cp build/app/outputs/flutter-apk/app-debug.apk ../SVOI-Android-preview.1.apk
          sha256sum ../SVOI-Android-preview.1.apk > ../SVOI-Android-preview.1.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start isolated VPN fixture
        run: |
          nohup .tools/android-core/xray run -config mobile/test-server.json > /tmp/svoi-xray-test.log 2>&1 &
          nohup python3 scripts/android-test-server.py > /tmp/svoi-http-test.log 2>&1 &
      - name: Verify Android tunnel and reconnects
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r SVOI-Android-preview.1.apk
            adb shell appops set dev.svoi.app.preview ACTIVATE_VPN allow
            cd flutter_client/android && ./gradlew connectedDebugAndroidTest
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            flutter_client/build/app/reports/androidTests/
            flutter_client/build/app/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        with:
          name: SVOI-Android-preview
          path: |
            SVOI-Android-preview.1.apk
            SVOI-Android-preview.1.apk.sha256
          retention-days: 14
