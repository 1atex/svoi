name: iOS client preview
on:
  push:
    branches: [ios-preview]
  workflow_dispatch:
    inputs:
      package_only:
        description: 'Rebuild the package without repeating unchanged interface tests'
        required: false
        default: false
        type: boolean
      visual_smoke:
        description: 'Capture the interface without repeating the full interaction suite'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: svoi-ios-${{ inputs.package_only && 'package' || 'preview' }}
  cancel-in-progress: true
jobs:
  visual:
    if: inputs.visual_smoke == true
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare interface assets
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 scripts/prepare-ios-resources.py
      - name: Check final typography
        run: python3 scripts/check-ios-interface.py pro --snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-final-typography
          path: |
            .tools/ios-ui/**/*.png
            .tools/ios-ui/*.log
  interface:
    if: inputs.package_only != true
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [compact, pro]
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Prepare interface assets
        run: python3 scripts/prepare-ios-resources.py
      - name: Check small and large iPhones
        run: python3 scripts/check-ios-interface.py "${{ matrix.device }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-interface-${{ matrix.device }}
          path: |
            .tools/ios-ui/**/*.png
            .tools/ios-ui/**/*.json
            .tools/ios-ui/*.log
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: mobile/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Prepare and check backend
        run: |
          python3 scripts/prepare-xray-patch.py
          go test ./...
          (cd mobile && go test -ldflags=-checklinkname=0 ./...)
      - name: Build client and Packet Tunnel
        run: bash scripts/build-ios.sh
      - name: Package Mac build sources
        run: python3 scripts/package-ios-source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-client-build-log
          path: .tools/ios-client-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: SVOI-iOS-client-unsigned
          path: releases/ios-v*/*
