name: Linux preview
on:
  push:
    tags: ['linux-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-preflight:
    runs-on: ubuntu-latest
    # Draft visibility requires repository push access; no mutation is performed here.
    permissions:
      contents: write
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Preserve an existing manually prepared release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push' || !context.ref.startsWith('refs/tags/')) {
              core.setOutput('build', 'true');
              return;
            }
            const tag = context.ref.slice('refs/tags/'.length);
            // Authenticated pagination includes drafts; API failures must fail the run.
            for await (const response of github.paginate.iterator(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            })) {
              if (response.data.some(release => release.tag_name === tag)) {
                core.info(`Release ${tag} already exists; preserve its files and publication state.`);
                core.setOutput('build', 'false');
                return;
              }
            }
            core.setOutput('build', 'true');
  linux:
    needs: release-preflight
    if: needs.release-preflight.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libayatana-appindicator3-dev libcap2-bin xvfb xdotool scrot openbox dbus-x11 gdb
      - name: Verify tag and build packages
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("config/linux-release.json"))["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "linux-v$VERSION" ]]; then exit 1; fi
          echo "LINUX_VERSION=$VERSION" >> "$GITHUB_ENV"
          bash scripts/build-linux.sh
      - name: Check backend and interface
        run: |
          export SVOI_TEST_CORE="$PWD/.tools/linux-core/xray"
          export SVOI_TEST_SING_BOX="$PWD/.tools/linux-core/sing-box"
          export SVOI_TEST_MIHOMO="$PWD/.tools/linux-core/mihomo"
          go test -tags native_core ./...
          go vet -tags native_core ./...
          cd flutter_client
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test test/linux_platform_test.dart test/controller_test.dart test/data_directory_test.dart test/appearance_test.dart test/community_test.dart test/onboarding_test.dart test/release_notice_test.dart test/portable_tools_test.dart test/ui_icons_test.dart
      - name: Verify traffic, reconnects and window lifecycle
        env:
          SVOI_LINUX_DEBUG_CLOSE: '0'
        run: |
          BUNDLE="$PWD/.tools/linux-package/$LINUX_VERSION/svoi"
          python3 scripts/linux-backend-smoke.py "$BUNDLE"
          sudo bash scripts/linux-tun-smoke.sh "$(id -un)"
          for attempt in $(seq 1 10); do
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/linux-ui-smoke.py "$BUNDLE" .tools/linux-ui-results/"$attempt"
          done
          for file in releases/linux-v"$LINUX_VERSION"/*.sha256; do (cd "$(dirname "$file")" && sha256sum -c "$(basename "$file")"); done
      - name: Verify Debian installation
        run: |
          sudo apt-get install -y ./releases/linux-v"$LINUX_VERSION"/SVOI-"$LINUX_VERSION"-linux-amd64.deb
          test "$(stat -c '%U:%G:%a' /opt/svoi/backend/core/xray)" = 'root:sudo:750'
          getcap /opt/svoi/backend/core/xray | grep -F 'cap_net_admin,cap_net_raw=ep'
          test "$(find /opt/svoi -type f -perm /0022 | wc -l)" = 0
          python3 scripts/linux-backend-smoke.py /opt/svoi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-test-diagnostics
          path: .tools/linux-ui-results/
      - uses: actions/upload-artifact@v4
        with:
          name: SVOI-Linux
          path: releases/linux-v*/*
      - name: Check release ownership before publication
        id: publish-guard
        if: github.ref_type == 'tag'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.slice('refs/tags/'.length);
            for await (const response of github.paginate.iterator(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            })) {
              if (response.data.some(release => release.tag_name === tag)) {
                core.info(`Release ${tag} was prepared elsewhere; automatic publication skipped.`);
                core.setOutput('publish', 'false');
                return;
              }
            }
            core.setOutput('publish', 'true');
      - name: Publish Linux preview
        if: github.ref_type == 'tag' && steps.publish-guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" releases/linux-v"$LINUX_VERSION"/* --title "SVOI Linux $LINUX_VERSION" --notes-file docs/LINUX-RELEASE-NOTES.md --verify-tag --prerelease --latest=false
    permissions:
      contents: write
