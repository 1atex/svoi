name: macOS release
on:
  push:
    tags: ['macos-v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Verify release version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("config/macos-release.json"))["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "macos-v$VERSION" ]]; then exit 1; fi
          echo "SVOI_MAC_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build application, WARP component and DMG
        run: bash scripts/build-macos.sh
      - name: Verify backend and interface
        run: |
          export SVOI_TEST_CORE="$PWD/.tools/macos-package/$SVOI_MAC_VERSION/core/xray"
          go test -tags native_core ./...
          go vet -tags native_core ./...
          cd flutter_client
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Verify proxy, component and disk image
        run: |
          python3 scripts/macos-helper-smoke.py ".tools/macos-package/$SVOI_MAC_VERSION/svoi-proxy"
          sudo -n python3 scripts/macos-helper-smoke.py ".tools/macos-package/$SVOI_MAC_VERSION/svoi-proxy" --apply
          python3 scripts/linux-backend-smoke.py flutter_client/build/macos/Build/Products/Release/SVOI.app/Contents/MacOS
          pkgutil --check-signature "flutter_client/build/macos/Build/Products/Release/SVOI.app/Contents/MacOS/backend/components/Cloudflare-WARP.pkg"
          for hash in releases/macos-v"$SVOI_MAC_VERSION"/*.sha256; do (cd "$(dirname "$hash")" && shasum -a 256 -c "$(basename "$hash")"); done
          hdiutil verify releases/macos-v"$SVOI_MAC_VERSION"/*.dmg
          codesign --verify --deep --strict flutter_client/build/macos/Build/Products/Release/SVOI.app
          open flutter_client/build/macos/Build/Products/Release/SVOI.app --args --demo
          sleep 6
          pgrep -x SVOI
          osascript -e 'tell application "SVOI" to quit'
      - uses: actions/upload-artifact@v4
        with:
          name: SVOI-macOS
          path: releases/macos-v*/*
      - name: Publish macOS RC
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" releases/macos-v"$SVOI_MAC_VERSION"/* --title "SVOI macOS $SVOI_MAC_VERSION" --notes-file docs/MACOS-RELEASE-NOTES.md --verify-tag --prerelease --latest=false
