name: macOS development preview
on:
  push:
    branches: ['macos-preview']
  workflow_dispatch:
    inputs:
      reuse_run:
        description: 'Validate an already built package from this workflow run'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-capability-check:
    if: inputs.reuse_run == ''
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone tunnel capability check
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          mkdir -p .tools
          bash scripts/build-ios-tunnel-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-tunnel-check-build-log
          path: .tools/ios-tunnel-check-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: SVOI-iOS-tunnel-capability-check
          path: releases/ios-tunnel-check/*
  macos:
    if: inputs.reuse_run == ''
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build Apple Silicon preview and DMG
        run: bash scripts/build-macos.sh
      - name: Check backend
        run: |
          export SVOI_TEST_CORE="$PWD/.tools/macos-package/0.6.0-preview.1/core/xray"
          go test -tags native_core ./...
          go vet -tags native_core ./...
      - name: Check interface
        if: ${{ !cancelled() }}
        run: |
          cd flutter_client
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Verify local proxy traffic and reconnects
        run: |
          python3 scripts/macos-helper-smoke.py .tools/macos-package/0.6.0-preview.1/svoi-proxy
          python3 scripts/linux-backend-smoke.py flutter_client/build/macos/Build/Products/Release/SVOI.app/Contents/MacOS
      - name: Verify packaged disk image
        run: |
          for hash in releases/macos-v*/SVOI-*.sha256; do
            (cd "$(dirname "$hash")" && shasum -a 256 -c "$(basename "$hash")")
          done
          hdiutil verify releases/macos-v*/SVOI-*.dmg
          open flutter_client/build/macos/Build/Products/Release/SVOI.app --args --demo
          sleep 8
          pgrep -x SVOI
          mkdir -p .tools/macos-diagnostics
          screencapture -x .tools/macos-diagnostics/preview.png
          osascript -e 'tell application "SVOI" to quit'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-diagnostics
          path: .tools/macos-diagnostics/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SVOI-macOS-development-preview
          path: releases/macos-v*/*
  installed-app:
    if: inputs.reuse_run != ''
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SVOI-macOS-development-preview
          path: .tools/package
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Verify copied application and native backend together
        run: |
          PACKAGE=$(python3 -c 'from pathlib import Path; files=list(Path(".tools/package").rglob("*.dmg")); assert len(files)==1; print(files[0].resolve().parent)')
          (cd "$PACKAGE" && shasum -a 256 -c *.sha256)
          mkdir -p .tools/mounted .tools/installed
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/.tools/mounted" "$PACKAGE"/*.dmg
          trap 'hdiutil detach "$PWD/.tools/mounted"' EXIT
          ditto .tools/mounted/SVOI.app .tools/installed/SVOI.app
          codesign --verify --deep --strict .tools/installed/SVOI.app
          python3 scripts/macos-app-smoke.py .tools/installed/SVOI.app .tools/macos-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-installed-app-diagnostics
          path: .tools/macos-diagnostics/
