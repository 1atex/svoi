name: Publish verified Linux package
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Linux preview run with successful package checks
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SVOI_LINUX_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and completed checks
        run: python3 scripts/publish-linux-artifact.py --validate-only
      - uses: actions/download-artifact@v4
        with:
          name: SVOI-Linux
          path: verified-linux
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish the verified package
        run: python3 scripts/publish-linux-artifact.py verified-linux
