name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-preflight:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Preserve an existing manually prepared release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push' || !context.ref.startsWith('refs/tags/')) {
              core.setOutput('build', 'true');
              return;
            }
            const tag = context.ref.slice('refs/tags/'.length);
            // Authenticated pagination includes drafts; API failures must fail the run.
            for await (const response of github.paginate.iterator(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            })) {
              if (response.data.some(release => release.tag_name === tag)) {
                core.info(`Release ${tag} already exists; preserve its files and publication state.`);
                core.setOutput('build', 'false');
                return;
              }
            }
            core.setOutput('build', 'true');
  windows:
    needs: release-preflight
    if: needs.release-preflight.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify version
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content backend/main.go -Raw), 'var nativeVersion = "([^"]+)"').Groups[1].Value
          if (!$version) { throw 'Application version is missing' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ' }
          "SVOI_VERSION=$version" >> $env:GITHUB_ENV
          $dir = "releases/v$version"
          "SVOI_RELEASE_DIR=$dir" >> $env:GITHUB_ENV
      - name: Fetch pinned Xray
        shell: pwsh
        run: |
          ./scripts/prepare-core.ps1
          python scripts/prepare-optional-cores.py --target windows-x64 --output core
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Prepare pinned Flutter SDK
        shell: pwsh
        run: |
          $sdkVersion = '3.47.7'
          $manifest = Invoke-RestMethod 'https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json'
          $sdk = $manifest.releases | Where-Object { $_.version -eq $sdkVersion -and $_.channel -eq 'stable' } | Select-Object -First 1
          if (!$sdk -or !$sdk.sha256) { throw 'Pinned Flutter SDK is unavailable' }
          New-Item -ItemType Directory -Force .tools/sdk | Out-Null
          Invoke-WebRequest "$($manifest.base_url)/$($sdk.archive)" -OutFile .tools/flutter.zip
          if ((Get-FileHash .tools/flutter.zip -Algorithm SHA256).Hash.ToLower() -ne $sdk.sha256) { throw 'Flutter SDK checksum mismatch' }
          tar -xf .tools/flutter.zip -C .tools/sdk
          if ($LASTEXITCODE) { throw 'Flutter SDK extraction failed' }
      - name: Build Flutter and installer
        shell: pwsh
        env:
          CI: 'true'
        run: |
          go test ./...
          if ($LASTEXITCODE) { throw 'Go tests failed' }
          go test -tags native_core ./...
          if ($LASTEXITCODE) { throw 'Native backend tests failed' }
          go vet ./...
          if ($LASTEXITCODE) { throw 'Go vet failed' }
          cmake -S flutter_client/windows/tests -B .ui-test/elevation-build -A x64
          if ($LASTEXITCODE) { throw 'Native test configuration failed' }
          cmake --build .ui-test/elevation-build --config Release
          if ($LASTEXITCODE) { throw 'Native test build failed' }
          ./.ui-test/elevation-build/Release/elevation_test.exe
          if ($LASTEXITCODE) { throw 'Native launch tests failed' }
          ./flutter_client/build-prototype.ps1 -Version $env:SVOI_VERSION
      - name: Authenticate update manifest
        shell: pwsh
        env:
          SVOI_UPDATE_SIGNING_KEY: ${{ secrets.SVOI_UPDATE_SIGNING_KEY }}
        run: |
          if (!$env:SVOI_UPDATE_SIGNING_KEY) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') { throw 'Release publication requires SVOI_UPDATE_SIGNING_KEY; unsigned release blocked' }
            Write-Output 'Review build only: update manifest signing key is not configured.'
            exit 0
          }
          $keyFile = Join-Path $env:RUNNER_TEMP 'svoi-update-signing.pem'
          try {
            [IO.File]::WriteAllText($keyFile, $env:SVOI_UPDATE_SIGNING_KEY)
            $installer = Join-Path $env:SVOI_RELEASE_DIR "SVOI-$env:SVOI_VERSION-windows-x64-setup.exe"
            go run ./cmd/sign-update-manifest -key $keyFile -installer $installer
            if ($LASTEXITCODE) { throw 'Update manifest signing failed' }
            $manifest = Join-Path $env:SVOI_RELEASE_DIR "SVOI-$env:SVOI_VERSION-windows-x64-update.json"
            Copy-Item -LiteralPath $manifest -Destination "$installer.update.json"
            $env:SVOI_TEST_SIGNED_UPDATE_INSTALLER = [IO.Path]::GetFullPath($installer)
            go test -tags native_core ./backend -run '^TestReleaseSignedUpdateManifest$' -count=1
            if ($LASTEXITCODE) { throw 'Signed release verification failed' }
            Remove-Item -LiteralPath "$installer.update.json"
          } finally {
            Remove-Item -LiteralPath $keyFile -ErrorAction SilentlyContinue
            Remove-Item Env:SVOI_UPDATE_SIGNING_KEY -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SVOI-windows
          path: |
            ${{ env.SVOI_RELEASE_DIR }}/*.exe
            ${{ env.SVOI_RELEASE_DIR }}/*.zip
            ${{ env.SVOI_RELEASE_DIR }}/*.sha256
            ${{ env.SVOI_RELEASE_DIR }}/*-update.json
      - name: Check release ownership before publication
        id: publish-guard
        if: github.ref_type == 'tag'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.slice('refs/tags/'.length);
            for await (const response of github.paginate.iterator(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            })) {
              if (response.data.some(release => release.tag_name === tag)) {
                core.info(`Release ${tag} was prepared elsewhere; automatic publication skipped.`);
                core.setOutput('publish', 'false');
                return;
              }
            }
            core.setOutput('publish', 'true');
      - name: Publish release
        if: github.ref_type == 'tag' && steps.publish-guard.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem $env:SVOI_RELEASE_DIR -File | ForEach-Object { $_.FullName }
          $notes = 'flutter_client/RELEASE-NOTES.md'
          $options = @('release','create',$env:GITHUB_REF_NAME,'--title',"SVOI $env:SVOI_VERSION",'--notes-file',$notes,'--verify-tag')
          if ($env:SVOI_VERSION -match '-(?:prebeta|beta|preview|rc)\.') { $options += '--prerelease' } else { $options += '--latest' }
          & gh @options @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
