name: SVOI
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: 'NO'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_BITCODE: 'NO'
targets:
  SVOI:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/core
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.svoi.app.ios
        SWIFT_OBJC_BRIDGING_HEADER: Shared/SvoiCore.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App-Info.plist
      properties:
        CFBundleDisplayName: SVOI
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        LSApplicationQueriesSchemes: [tg]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - framework: Frameworks/SvoiMobile.xcframework
        embed: false
      - target: PacketTunnel
        embed: true
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
      - path: Resources/core
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.svoi.app.ios.PacketTunnel
        SWIFT_OBJC_BRIDGING_HEADER: Shared/SvoiCore.h
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
    info:
      path: PacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: SVOI VPN
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - framework: Frameworks/SvoiMobile.xcframework
        embed: false
schemes:
  SVOI:
    build:
      targets:
        SVOI: all
