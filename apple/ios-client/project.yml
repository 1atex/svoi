name: SVOI
options:
  developmentLanguage: ru
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '3'
    CODE_SIGNING_ALLOWED: 'NO'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_BITCODE: 'NO'
    OTHER_LDFLAGS: ['$(inherited)', '-ObjC', '-lresolv']
targets:
  SVOI:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/core
        type: folder
        buildPhase: resources
      - path: Resources/licenses
        type: folder
        buildPhase: resources
      - path: Resources/dns-providers.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.svoi.app.ios
        SWIFT_OBJC_BRIDGING_HEADER: Shared/SvoiCore.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App-Info.plist
      properties:
        CFBundleDisplayName: SVOI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        LSApplicationQueriesSchemes: [tg]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - framework: Frameworks/SvoiMobile.xcframework
        embed: false
      - target: PacketTunnel
        embed: true
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
      - path: Resources/core
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.svoi.app.ios.PacketTunnel
        SWIFT_OBJC_BRIDGING_HEADER: Shared/SvoiCore.h
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
    info:
      path: PacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: SVOI VPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - framework: Frameworks/SvoiMobile.xcframework
        embed: false
  SVOIInterfacePreview:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/Assets.swift
      - path: Shared/SvoiCore.h
      - path: ../../tests/ios/PreviewCore.m
      - path: Resources/dns-providers.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.svoi.interfacepreview
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: SVOI_UI_PREVIEW
        SWIFT_OBJC_BRIDGING_HEADER: Shared/SvoiCore.h
        HEADER_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/Shared']
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: InterfacePreview-Info.plist
      properties:
        CFBundleDisplayName: SVOI UI Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  SVOINetworkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/NetworkChecks.swift
      - path: ../../tests/ios/NetworkTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.svoi.networktests
        GENERATE_INFOPLIST_FILE: 'YES'
  SVOIInterfaceTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../tests/ios/InterfaceTests.swift
    dependencies:
      - target: SVOIInterfacePreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.svoi.interfacetests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: SVOIInterfacePreview
schemes:
  SVOIInterfacePreview:
    build:
      targets:
        SVOIInterfacePreview: all
    test:
      targets: [SVOINetworkTests, SVOIInterfaceTests]
  SVOI:
    build:
      targets:
        SVOI: all
